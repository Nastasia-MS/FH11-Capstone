[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixedsignal-gui"
version = "0.1.0"
authors = [
{ name="Nastasia Maldei-Stumm", email="n.maldeistumm@utexas.edu" }
]
description = "Signal generation, augmentation, and classification GUI with ML"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["signal-processing", "ML", "GUI", "PySide6", "Sionna", "Tensorflow"]
classifiers = [
	"Programming Language :: Python :: 3",
	"License :: OSI Approved :: MIT License",
	"Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICENCSE*"]

dependencies = [
	"numpy>=1.24",
	"matplotlib",
	"torch",
	"tensorflow",
	"sionna",
	"pyside6",
]

[project.urls]
Homepage = "https://github.com/Nastasia-MS/FH11-Capstone"

[project.scripts]
mixedsignal-gui = "mixedsignal_gui.main_window:main"
