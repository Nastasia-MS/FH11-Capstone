[metadata]
name = mixedsignal_gui
version = 0.1.0
author = Nastasia Maldei-Stumm 
author_email = n.maldeistumm@utexas.edu
description = Signal Generation & Classification GUI
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.10
include_package_data = True

[options.packages.find]
where = mixedsignal_gui

[options.package_data]
mixedsignal_gui =
    resources/*
    waveform_functions/*.m
    waveform_functions/*.mat

[options.extras_require]
dev =
    black
    isort
    mypy
    pytest
